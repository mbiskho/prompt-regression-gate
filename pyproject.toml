[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptgate"
version = "0.1.0"
description = "Fails the build when a prompt edit makes the output worse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bisma Khomeini", email = "khomeini.bisma@gmail.com" }]
keywords = ["llm", "testing", "regression", "evaluation", "ci", "prompts", "llmops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
# One dependency. A test gate with a heavy install is a test gate that does
# not get added to the pipeline.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/bismakhomeini/prompt-regression-gate"
Repository = "https://github.com/bismakhomeini/prompt-regression-gate"

[project.scripts]
promptgate = "promptgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["promptgate"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/promptgate"]
