name: Nightly drift

# The prompt is only half of the system. The other half is a model you do not
# control, and providers change what sits behind a name. A suite that only
# runs on pull requests cannot see that: nothing in your repo changed, so
# nothing triggered, and the first sign of trouble is a support ticket.
#
# This job runs the same golden set against *pinned* model versions on a
# schedule and opens an issue when the results move.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin to dated snapshots, never to a floating alias like "latest" or
        # a bare family name - the whole point is to detect the provider
        # moving underneath you, which a floating alias hides by design.
        model:
          - gpt-4o-mini-2024-07-18
          - claude-haiku-4-5-20251001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Restore the drift baseline for this model
        uses: actions/cache@v4
        with:
          path: .promptgate
          key: drift-${{ matrix.model }}-${{ hashFiles('examples/golden/*.yaml') }}
          restore-keys: drift-${{ matrix.model }}-

      - name: Run against the pinned model
        id: run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          promptgate \
            --provider "${{ vars.PROMPTGATE_PROVIDER || 'mock' }}" \
            --budget "${{ vars.PROMPTGATE_NIGHTLY_BUDGET || '2.0' }}" \
            --json drift.json \
            gate examples/golden/triage.yaml \
            --baseline-label "drift-${{ matrix.model }}" \
            --label "drift-$(date -u +%F)"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Open an issue if the model moved
        if: steps.run.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = JSON.parse(fs.readFileSync('drift.json', 'utf8'));
            const cases = diff.regressed.map(r => `- \`${r.case_id}\` — ${r.detail}`).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Model drift: ${{ matrix.model }} (${diff.regressed.length} cases)`,
              labels: ['drift'],
              body: [
                `The nightly run against \`${{ matrix.model }}\` regressed against its own baseline.`,
                ``,
                `No prompt changed. Either the provider changed the model behind this name, or`,
                `these cases are flaky — check \`promptgate history\` before assuming the former.`,
                ``,
                `Pass rate ${(diff.pass_rate_before * 100).toFixed(1)}% → ${(diff.pass_rate_after * 100).toFixed(1)}%`,
                ``,
                cases,
              ].join('\n'),
            });

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-${{ matrix.model }}
          path: drift.json
