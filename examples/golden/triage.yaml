version: 2026-08-02.1
description: Support ticket triage. Closed label set, so almost everything is a deterministic assertion.
min_pass_rate: 0.85
prompt:
  id: triage
  version: v1
  model: mock/small
  template_file: ../prompts/triage.v1.txt
cases:
- id: triage-000
  inputs:
    ticket: I was charged twice for the Pro plan this month.
  checks:
    one_of: &id001
    - billing
    - bug
    - feature_request
    - account_access
    - other
    expected_label: billing
    max_words: 6
    max_latency_ms: 3000
  tags:
  - billing
- id: triage-001
  inputs:
    ticket: Can you explain the $129.50 line on my March invoice?
  checks:
    one_of: *id001
    expected_label: billing
    max_words: 6
    max_latency_ms: 3000
  tags:
  - billing
- id: triage-002
