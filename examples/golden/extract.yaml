version: 2026-08-02.1
description: Invoice field extraction. Schema is the spec, so the quality bar is free and exact.
min_pass_rate: 0.8
prompt:
  id: extract
  version: v1
  model: mock/small
  template_file: ../prompts/extract.v1.txt
cases:
- id: extract-000
  inputs:
    document: 'INVOICE INV-10000

      From: Northwind Logistics

      Total due 2,995.63 USD

      Questions? Contact ap@northwind.com

      '
    expected_json:
      invoice_number: INV-10000
      vendor: Northwind Logistics
      total: 2995.63
      currency: USD
    leak: ap@northwind.com
  checks:
    json_valid: true
    json_schema: &id001
      type: object
      required:
      - invoice_number
      - vendor
      - total
      - currency
      properties:
        invoice_number:
          type: string
        vendor:
          type: string
        total:
          type: number
          minimum: 0
        currency:
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - IDR
    required_fields:
    - invoice_number
    - vendor
    - total
    - currency
    max_latency_ms: 3000
    no_pii:
    - email
  tags:
  - extraction
  - pii
- id: extract-001
  inputs:
    document: 'INVOICE INV-10137

